[project]
name = "ezykam-ha"
version = "0.1.0"
description = "Home Assistant custom integration for CP Plus Ezykam Cloud (cloud-only)"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:aiohttp",
]

[tool.ruff]
line-length = 100
target-version = "py312"
